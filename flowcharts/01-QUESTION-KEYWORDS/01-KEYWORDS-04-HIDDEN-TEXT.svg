<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
<title>Question Keywords 04 — Hidden Clue &amp; Strange Text</title><desc>OSINT CTF branching decision flowchart</desc>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#17304b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#86a7cc"/></marker></defs>
<rect width="100%" height="100%" fill="#07111f"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.32"/>
<text text-anchor="start" font-family="Tahoma" font-size="42" font-weight="800" fill="#eaf2ff"><tspan x="90" y="78.0">Question Keywords 04 — Hidden Clue &amp; Strange Text</tspan></text><text text-anchor="start" font-family="Tahoma" font-size="20" font-weight="700" fill="#55d98b"><tspan x="90" y="116.5">QUESTION WORDING → ROUTE → EXACT FIRST</tspan><tspan x="90" y="143.5">ACTION</tspan></text><rect x="300" y="170" width="1200" height="125" rx="28" fill="#2458a6" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="324" y="198.0">RECOGNIZE</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="900" y="226.5">อ่านข้อความตามตัวอักษรก่อน: สิ่งที่โจทย์ถามคือ location, identity, time,</tspan><tspan x="900" y="257.5">source หรือ hidden clue?</tspan></text><rect x="70" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="383.0">DECODE</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="250" y="429.5">“Decode following”</tspan><tspan x="250" y="460.5">“What does this mean?”</tspan><tspan x="250" y="491.5">“Identify encoding”</tspan><tspan x="250" y="522.5">“Follow encoded clue”</tspan><tspan x="250" y="553.5">“What URL does this</tspan><tspan x="250" y="584.5">represent?”</tspan></text><polygon points="250,703 425,770 250,837 75,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="250" y="754.5">มี artifact หรือ clue</tspan><tspan x="250" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="70" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="250" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="250" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="250" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="70" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="250" y="1123.5">ตรวจ alphabet, length,</tspan><tspan x="250" y="1154.5">separators, padding</tspan><tspan x="250" y="1185.5">ก่อนทดสอบ; compatible</tspan><tspan x="250" y="1216.5">ไม่ได้แปลว่าใช่</tspan></text><rect x="70" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="250" y="1501.0">python3 -c 'import</tspan><tspan x="250" y="1529.0">base64;print(base64.b64decode("SGVsbG8=",validate=True))'</tspan></text><path d="M250,640 V671 H250 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M165,837 H50 V1160 H70" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="90" y="1018.0">YES</tspan></text><path d="M335,837 V843 H250 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="292" y="833.0">NO</tspan></text><path d="M250,1275 V1332 H250 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="500" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="383.0">EXTRACT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="680" y="445.0">“Extract information”</tspan><tspan x="680" y="476.0">“Find hidden clue”</tspan><tspan x="680" y="507.0">“Hidden in plain sight”</tspan><tspan x="680" y="538.0">“Inspect metadata”</tspan><tspan x="680" y="569.0">“Embedded text?”</tspan></text><polygon points="680,703 855,770 680,837 505,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="680" y="754.5">มี artifact หรือ clue</tspan><tspan x="680" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="500" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="680" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="680" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="680" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="500" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="680" y="1139.0">ใช้ file/strings/metadata/OCR</tspan><tspan x="680" y="1170.0">ตามชนิดไฟล์; ห้าม execute</tspan><tspan x="680" y="1201.0">output</tspan></text><rect x="500" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="680" y="1459.0">file evidence.bin</tspan><tspan x="680" y="1487.0">strings -a -n 6 evidence.bin</tspan><tspan x="680" y="1515.0">| head -100</tspan><tspan x="680" y="1543.0">exiftool -a -G1 -s</tspan><tspan x="680" y="1571.0">evidence.bin</tspan></text><path d="M680,640 V671 H680 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M595,837 H480 V1160 H500" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="520" y="1018.0">YES</tspan></text><path d="M765,837 V843 H680 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="722" y="833.0">NO</tspan></text><path d="M680,1275 V1332 H680 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="930" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="383.0">STRUCTURED</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="445.0">“JWT token”</tspan><tspan x="1110" y="476.0">“Escaped JSON”</tspan><tspan x="1110" y="507.0">“Data URI”</tspan><tspan x="1110" y="538.0">“Punycode domain”</tspan><tspan x="1110" y="569.0">“Unix timestamp”</tspan></text><polygon points="1110,703 1285,770 1110,837 935,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="1110" y="754.5">มี artifact หรือ clue</tspan><tspan x="1110" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="930" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="1110" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="1110" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="930" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="1139.0">parse แบบ local และอ่าน</tspan><tspan x="1110" y="1170.0">header/type; JWT decode</tspan><tspan x="1110" y="1201.0">ไม่ใช่ signature verification</tspan></text><rect x="930" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="1473.0">python3 -c 'import</tspan><tspan x="1110" y="1501.0">json;print(json.loads(open("input.txt").read()))'</tspan><tspan x="1110" y="1529.0">python3 -m json.tool</tspan><tspan x="1110" y="1557.0">input.json</tspan></text><path d="M1110,640 V671 H1110 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1025,837 H910 V1160 H930" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="950" y="1018.0">YES</tspan></text><path d="M1195,837 V843 H1110 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="1152" y="833.0">NO</tspan></text><path d="M1110,1275 V1332 H1110 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="1360" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="383.0">FAILED / BINARY</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="445.0">“Decode failed”</tspan><tspan x="1540" y="476.0">“Decoded to binary”</tspan><tspan x="1540" y="507.0">“Looks like hash”</tspan><tspan x="1540" y="538.0">“Double encoded”</tspan><tspan x="1540" y="569.0">“Invisible characters”</tspan></text><polygon points="1540,703 1715,770 1540,837 1365,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="1540" y="754.5">มี artifact หรือ clue</tspan><tspan x="1540" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="1360" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="1540" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="1540" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="1360" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="1123.5">หยุดเดา; ตรวจ</tspan><tspan x="1540" y="1154.5">magic/entropy/Unicode</tspan><tspan x="1540" y="1185.5">แล้วตั้ง hypothesis ใหม่;</tspan><tspan x="1540" y="1216.5">จำกัดขนาดก่อน decompress</tspan></text><rect x="1360" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="1473.0">file decoded.bin</tspan><tspan x="1540" y="1501.0">xxd -l 64 decoded.bin</tspan><tspan x="1540" y="1529.0">python3 -c</tspan><tspan x="1540" y="1557.0">'print(repr(open("input.txt",encoding="utf-8").read()))'</tspan></text><path d="M1540,640 V671 H1540 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1455,837 H1340 V1160 H1360" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="1380" y="1018.0">YES</tspan></text><path d="M1625,837 V843 H1540 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="1582" y="833.0">NO</tspan></text><path d="M1540,1275 V1332 H1540 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="300" y="1700" width="1200" height="165" rx="28" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="324" y="1728.0">INTERPRET + PRIVACY GATE</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="600" fill="#eaf2ff"><tspan x="900" y="1776.5">ผลตรงคำถามหรือไม่? ถ้าไม่ตรง ให้ย้อนเปลี่ยนชนิดหลักฐาน ไม่ใช่รันคำสั่งเดิมซ้ำ</tspan><tspan x="900" y="1807.5">• ทุก text query ที่ส่ง search engine ถือว่าออกนอกเครื่อง</tspan></text><rect x="300" y="1915" width="1200" height="140" rx="28" fill="#b06f00" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="324" y="1943.0">NEXT / RELATED</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="600" fill="#eaf2ff"><tspan x="900" y="1995.0">NEXT: 04-TEXT-01-IDENTIFY • 04-TEXT-05-NESTED-COMPRESSED</tspan></text>
<text x="1710" y="2155" text-anchor="end" font-family="Tahoma" font-size="18" fill="#a8bad2">OSINT T_T • local-first • evidence-based</text>
