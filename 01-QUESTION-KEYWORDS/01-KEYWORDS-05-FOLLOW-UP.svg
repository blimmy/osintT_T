<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
<title>Question Keywords 05 — Follow-up &amp; Evidence Reuse</title><desc>OSINT CTF branching decision flowchart</desc>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#17304b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#86a7cc"/></marker></defs>
<rect width="100%" height="100%" fill="#07111f"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.32"/>
<text text-anchor="start" font-family="Tahoma" font-size="42" font-weight="800" fill="#eaf2ff"><tspan x="90" y="78.0">Question Keywords 05 — Follow-up &amp; Evidence Reuse</tspan></text><text text-anchor="start" font-family="Tahoma" font-size="20" font-weight="700" fill="#55d98b"><tspan x="90" y="116.5">QUESTION WORDING → ROUTE → EXACT FIRST</tspan><tspan x="90" y="143.5">ACTION</tspan></text><rect x="300" y="170" width="1200" height="125" rx="28" fill="#2458a6" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="324" y="198.0">RECOGNIZE</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="900" y="226.5">อ่านข้อความตามตัวอักษรก่อน: สิ่งที่โจทย์ถามคือ location, identity, time,</tspan><tspan x="900" y="257.5">source หรือ hidden clue?</tspan></text><rect x="70" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="383.0">LOCATION PIVOT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="250" y="445.0">“Based on previous location”</tspan><tspan x="250" y="476.0">“Building nearby?”</tspan><tspan x="250" y="507.0">“Company operates it?”</tspan><tspan x="250" y="538.0">“What year opened?”</tspan><tspan x="250" y="569.0">“Landmark behind it?”</tspan></text><polygon points="250,703 425,770 250,837 75,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="250" y="754.5">มี artifact หรือ clue</tspan><tspan x="250" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="70" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="250" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="250" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="250" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="70" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="250" y="1123.5">ใช้ชื่อ+พิกัดที่ยืนยันแล้วเป็น</tspan><tspan x="250" y="1154.5">anchor; ตรวจ official</tspan><tspan x="250" y="1185.5">record/map object แล้วค่อย</tspan><tspan x="250" y="1216.5">pivot</tspan></text><rect x="70" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="94" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="250" y="1487.0">printf '%s\n' '"Station Name"</tspan><tspan x="250" y="1515.0">operator opened'</tspan><tspan x="250" y="1543.0"># external text query</tspan></text><path d="M250,640 V671 H250 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M165,837 H50 V1160 H70" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="90" y="1018.0">YES</tspan></text><path d="M335,837 V843 H250 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="292" y="833.0">NO</tspan></text><path d="M250,1275 V1332 H250 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="500" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="383.0">SOURCE PIVOT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="680" y="445.0">“Original public username?”</tspan><tspan x="680" y="476.0">“Which public platform?”</tspan><tspan x="680" y="507.0">“When was post published?”</tspan><tspan x="680" y="538.0">“Location mentioned?”</tspan><tspan x="680" y="569.0">“Who reposted it?”</tspan></text><polygon points="680,703 855,770 680,837 505,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="680" y="754.5">มี artifact หรือ clue</tspan><tspan x="680" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="500" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="680" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="680" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="680" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="500" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="680" y="1123.5">รักษา permalink, post ID,</tspan><tspan x="680" y="1154.5">exact phrase, UTC; แยก</tspan><tspan x="680" y="1185.5">original จาก repost ด้วย</tspan><tspan x="680" y="1216.5">chronology</tspan></text><rect x="500" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="524" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="680" y="1459.0">rg -n -i</tspan><tspan x="680" y="1487.0">'canonical|author|datePublished'</tspan><tspan x="680" y="1515.0">page.html</tspan><tspan x="680" y="1543.0">exiftool -time:all</tspan><tspan x="680" y="1571.0">saved-image.jpg</tspan></text><path d="M680,640 V671 H680 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M595,837 H480 V1160 H500" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="520" y="1018.0">YES</tspan></text><path d="M765,837 V843 H680 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="722" y="833.0">NO</tspan></text><path d="M680,1275 V1332 H680 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="930" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="383.0">DOMAIN PIVOT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="445.0">“Who operates domain?”</tspan><tspan x="1110" y="476.0">“Previous site name?”</tspan><tspan x="1110" y="507.0">“Historical date?”</tspan><tspan x="1110" y="538.0">“Official website?”</tspan><tspan x="1110" y="569.0">“Related organization?”</tspan></text><polygon points="1110,703 1285,770 1110,837 935,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="1110" y="754.5">มี artifact หรือ clue</tspan><tspan x="1110" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="930" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="1110" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="1110" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="930" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="1139.0">URL → hostname → DNS/RDAP →</tspan><tspan x="1110" y="1170.0">legal/about → archive;</tspan><tspan x="1110" y="1201.0">ความสัมพันธ์แต่ละช่วงต้องมีหลักฐาน</tspan></text><rect x="930" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="954" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="1110" y="1473.0">python3 -c 'from urllib.parse</tspan><tspan x="1110" y="1501.0">import</tspan><tspan x="1110" y="1529.0">urlsplit;print(urlsplit("https://example.org/a").hostname)'</tspan><tspan x="1110" y="1557.0">dig +short example.org NS</tspan></text><path d="M1110,640 V671 H1110 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1025,837 H910 V1160 H930" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="950" y="1018.0">YES</tspan></text><path d="M1195,837 V843 H1110 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="1152" y="833.0">NO</tspan></text><path d="M1110,1275 V1332 H1110 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="1360" y="355" width="360" height="285" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="383.0">TIME / EVENT PIVOT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="445.0">“Event date?”</tspan><tspan x="1540" y="476.0">“Venue?”</tspan><tspan x="1540" y="507.0">“Organizer?”</tspan><tspan x="1540" y="538.0">“What happened next?”</tspan><tspan x="1540" y="569.0">“Which schedule entry?”</tspan></text><polygon points="1540,703 1715,770 1540,837 1365,770" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="1540" y="754.5">มี artifact หรือ clue</tspan><tspan x="1540" y="785.5">ชนิดนี้จริงไหม?</tspan></text><rect x="1360" y="850" width="360" height="150" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="878.0">NO • WORDING-ONLY FALLBACK</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="904.0">ไม่มี artifact → ไป category</tspan><tspan x="1540" y="935.0">ที่อ้างถึงจาก wording;</tspan><tspan x="1540" y="966.0">อย่ารันคำสั่งไฟล์</tspan></text><rect x="1360" y="1045" width="360" height="230" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="1073.0">FIRST ACTION</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="1123.5">สร้าง timeline พร้อม source</tspan><tspan x="1540" y="1154.5">class และ timezone; official</tspan><tspan x="1540" y="1185.5">schedule + contemporaneous</tspan><tspan x="1540" y="1216.5">report</tspan></text><rect x="1360" y="1390" width="360" height="230" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1384" y="1418.0">COPYABLE COMMAND / QUERY</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="1540" y="1459.0">python3 -c 'import</tspan><tspan x="1540" y="1487.0">datetime;print(datetime.datetime.fromtimestamp(1700000000,datetime.timezone.utc))'</tspan><tspan x="1540" y="1515.0">rg -n</tspan><tspan x="1540" y="1543.0">'DATE|LOCATION|ORGANIZER'</tspan><tspan x="1540" y="1571.0">notes.txt</tspan></text><path d="M1540,640 V671 H1540 V702" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1455,837 H1340 V1160 H1360" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="1380" y="1018.0">YES</tspan></text><path d="M1625,837 V843 H1540 V850" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="1582" y="833.0">NO</tspan></text><path d="M1540,1275 V1332 H1540 V1390" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><rect x="300" y="1700" width="1200" height="165" rx="28" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="324" y="1728.0">INTERPRET + PRIVACY GATE</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="600" fill="#eaf2ff"><tspan x="900" y="1776.5">ผลตรงคำถามหรือไม่? ถ้าไม่ตรง ให้ย้อนเปลี่ยนชนิดหลักฐาน ไม่ใช่รันคำสั่งเดิมซ้ำ</tspan><tspan x="900" y="1807.5">• ทุก text query ที่ส่ง search engine ถือว่าออกนอกเครื่อง</tspan></text><rect x="300" y="1915" width="1200" height="140" rx="28" fill="#b06f00" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="324" y="1943.0">NEXT / RELATED</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="600" fill="#eaf2ff"><tspan x="900" y="1979.5">NEXT: 10-PIVOT-01-LOCATION-CHAINS through 10-PIVOT-05-MIXED-CHAINS •</tspan><tspan x="900" y="2010.5">12-STUCK-04-VERIFY</tspan></text>
<text x="1710" y="2155" text-anchor="end" font-family="Tahoma" font-size="18" fill="#a8bad2">OSINT T_T • local-first • evidence-based</text>
</svg>