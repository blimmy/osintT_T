<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
<title>Geolocation 03 — Roads, Signs &amp; Transit</title><desc>OSINT CTF branching decision flowchart</desc>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#17304b" stroke-width="1"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#86a7cc"/></marker></defs>
<rect width="100%" height="100%" fill="#07111f"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.32"/>
<text text-anchor="start" font-family="Tahoma" font-size="42" font-weight="800" fill="#eaf2ff"><tspan x="90" y="78.0">Geolocation 03 — Roads, Signs &amp; Transit</tspan></text><text text-anchor="start" font-family="Tahoma" font-size="20" font-weight="700" fill="#55d98b"><tspan x="90" y="130.0">LOCAL FIRST • Do not upload supplied evidence</tspan></text><rect x="310" y="175" width="1180" height="150" rx="28" fill="#2458a6" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="334" y="203.0">INPUT / TRIGGER</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="900" y="260.0">Road sign, bus/train, platform, route number, markings</tspan></text><rect x="310" y="380" width="1180" height="145" rx="28" fill="#5b3aa8" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="334" y="408.0">RECOGNIZE + CLASSIFY</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="900" y="446.5">แยก national standard จาก local operator; route number ต้องจับคู่</tspan><tspan x="900" y="477.5">destination/direction ด้วย</tspan></text><polygon points="900,555 1420,660 900,765 380,660" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="900" y="644.5">อ่าน route/operator/destination</tspan><tspan x="900" y="675.5">ได้อย่างน้อยหนึ่งอย่างหรือไม่?</tspan></text><rect x="110" y="820" width="700" height="190" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="134" y="848.0">YES • TOOL + COMMAND</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="460" y="883.0">Crop + OCR</tspan><tspan x="460" y="911.0">magick image.jpg -crop 1000x600+200+100 +repage</tspan><tspan x="460" y="939.0">-resize 300% sign.png</tspan><tspan x="460" y="967.0">tesseract sign.png stdout --psm 11</tspan></text><rect x="990" y="820" width="700" height="190" rx="28" fill="#152b40" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1014" y="848.0">NO • ALTERNATIVE</tspan></text><text text-anchor="middle" font-family="Menlo" font-size="21" font-weight="500" fill="#eaf2ff"><tspan x="1340" y="911.0">Physical standard comparison</tspan><tspan x="1340" y="939.0">magick image.jpg -crop 1200x800+0+200 road.png</tspan></text><rect x="110" y="1060" width="700" height="170" rx="28" fill="#087e8b" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="134" y="1088.0">EXPECTED RESULT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="460" y="1155.0">route + place/agency token</tspan></text><rect x="990" y="1060" width="700" height="170" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1014" y="1088.0">FAILURE SIGNAL</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1340" y="1155.0">ไม่มีตัวอักษร; สี/shape/markings เท่านั้น</tspan></text><rect x="110" y="1280" width="700" height="180" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="134" y="1308.0">NEXT ACTION / PIVOT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="460" y="1364.5">ค้น official timetable/network map ด้วย text; verify</tspan><tspan x="460" y="1395.5">stop sequence/track layout</tspan></text><rect x="990" y="1280" width="700" height="180" rx="28" fill="#198754" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1014" y="1308.0">NEW HYPOTHESIS</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1340" y="1364.5">ใช้เป็น country filter ไม่ใช่ station proof; pivot</tspan><tspan x="1340" y="1395.5">vehicles/building/terrain</tspan></text><polygon points="900,1500 1420,1600 900,1700 380,1600" fill="#d49a20" stroke="#ffd56a" stroke-width="3"/><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="700" fill="#eaf2ff"><tspan x="900" y="1584.5">หลักฐานสองแหล่งสอดคล้องกันหรือไม่?</tspan><tspan x="900" y="1615.5">Do two independent sources agree?</tspan></text><rect x="1450" y="1515" width="300" height="170" rx="28" fill="#a33b4c" stroke="#ff9aa7" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="1474" y="1543.0">NO • NOT READY</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="1600" y="1579.0">กลับไปที่ relationship</tspan><tspan x="1600" y="1610.0">ที่ยังขาดหลักฐาน →</tspan><tspan x="1600" y="1641.0">12-STUCK-04-VERIFY</tspan></text><rect x="310" y="1760" width="1180" height="175" rx="28" fill="#b06f00" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="334" y="1788.0">VERIFY BEFORE SUBMIT</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="600" fill="#eaf2ff"><tspan x="900" y="1841.5">transit answer ต้องตรง route, operator, direction และ visual environment;</tspan><tspan x="900" y="1872.5">timetable current อาจไม่ prove historical scene</tspan></text><rect x="310" y="1980" width="1180" height="125" rx="28" fill="#0d1b2e" stroke="#c8dcf5" stroke-width="3"/><text text-anchor="start" font-family="Tahoma" font-size="18" font-weight="700" fill="#a8bad2"><tspan x="334" y="2008.0">RELATED DIAGRAMS</tspan></text><text text-anchor="middle" font-family="Tahoma" font-size="23" font-weight="500" fill="#eaf2ff"><tspan x="900" y="2052.0">NEXT: 03-GEO-07-MULTIPLE-CANDIDATES • 10-PIVOT-01-LOCATION-CHAINS</tspan></text><path d="M900,325 V352 H900 V380" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M900,525 V540 H900 V555" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M640,755 V787 H460 V820" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="550" y="777.0">YES</tspan></text><path d="M1160,755 V787 H1340 V820" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#ff7d8b"><tspan x="1250" y="777.0">NO</tspan></text><path d="M460,1010 V1035 H460 V1060" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1340,1010 V1035 H1340 V1060" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M460,1230 V1255 H460 V1280" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1340,1230 V1255 H1340 V1280" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M460,1460 V1480 H680 V1500" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M1340,1460 V1480 H1120 V1500" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M900,1700 V1730 H900 V1760" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Tahoma" font-size="19" font-weight="800" fill="#55d98b"><tspan x="938" y="1720.0">YES</tspan></text><path d="M1420,1600 H1450" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/><path d="M900,1935 V1957 H900 V1980" fill="none" stroke="#86a7cc" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1710" y="2155" text-anchor="end" font-family="Tahoma" font-size="18" fill="#a8bad2">OSINT T_T • local-first • evidence-based</text>
</svg>